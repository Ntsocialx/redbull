services:
  - type: web
    name: red-bull-tut-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --ignore-scripts && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        value: red-bull-tut-admin
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: red-bull-tut/events
